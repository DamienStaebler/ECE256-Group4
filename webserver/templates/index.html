<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Star Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #450a0a 0%, #022c22 100%);
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            user-select: none;
            z-index: 10;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        .glass-box {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 24px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .song-btn {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .song-btn.red { border-left: 8px solid #ef4444; }
        .song-btn.green { border-left: 8px solid #22c55e; }
        .song-btn.gold { border-left: 8px solid #eab308; }

        .song-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .song-btn:active {
            transform: translateY(0);
        }

        .control-grid {
            display: grid;
            gap: 10px;
            margin-top: 2rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 5px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .action-btn:active { transform: scale(0.95); }

        #status-bar {
            font-size: 0.8rem;
            color: #d1d5db;
            margin-top: 1.5rem;
            text-align: center;
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="snow-container" id="snow-zone"></div>

    <div class="glass-box">
        <h1 class="text-3xl font-bold mb-6 text-center tracking-wide text-yellow-500">Music Player</h1>

        <div id="song-list">
            <button class="song-btn red" onclick="sendCmd('t', 'Twinkle Twinkle')">
                <span class="mr-3">⭐</span> Twinkle Twinkle
            </button>
            <button class="song-btn green" onclick="sendCmd('s', 'Silent Night')">
                <span class="mr-3">🎄</span> Silent Night
            </button>
            <button class="song-btn gold" onclick="sendCmd('j', 'Jingle Bells')">
                <span class="mr-3">🔔</span> Jingle Bells
            </button>
        </div>

        <div class="control-grid">
            <button class="action-btn bg-red-700/40 border-red-500/50" onclick="sendCmd('p', 'Play/Pause')">Play/Pause</button>
        </div>

        <div id="status-bar">> Ready for Command</div>
    </div>

    <script>
        function createSnow() {
            const container = document.getElementById('snow-zone');
            const icons = ['❄', '•', '*', '❅', '❆'];
            
            setInterval(() => {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                
                const startX = Math.random() * 100;
                const duration = Math.random() * 4 + 4;
                const size = Math.random() * 12 + 8;
                
                snowflake.style.left = startX + 'vw';
                snowflake.style.fontSize = size + 'px';
                snowflake.style.animationDuration = duration + 's';
                snowflake.style.opacity = Math.random() * 0.7 + 0.3;
                
                container.appendChild(snowflake);
                
                setTimeout(() => {
                    snowflake.remove();
                }, duration * 1000);
            }, 180);
        }

        function sendCmd(char, label) {
            const status = document.getElementById('status-bar');
            status.innerText = "> Sending: " + char + " (" + label + ")";
            status.style.color = "#fbbf24";
            
            fetch('/send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: char + "\n" })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    status.style.color = "#4ade80";
                    status.innerText = "> Sent '" + char;
                } else {
                    status.style.color = "#f87171";
                    status.innerText = "> Error: " + data.message;
                }
            })
            .catch(err => {
                status.style.color = "#f87171";
                status.innerText = "> Error: Connection Failed";
            });
        }

        window.onload = createSnow;
    </script>
</body>
</html>
